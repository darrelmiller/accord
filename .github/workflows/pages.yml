name: Publish documentation to Pages

on:
  push:
    branches: [darrelmiller-accord-local-authoring]
    paths:
      - docs/**
      - examples/handbook.html
      - examples/notes/decisions.html
      - examples/assets/workflow.png
      - ui/styles.css
      - scripts/build-pages.mjs
      - tests/pages.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:pages
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
